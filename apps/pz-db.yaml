apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pz-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/techsc0ut/pager-zero-gitops.git
    targetRevision: HEAD
    path: base/pz-db
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
